[project]
name = "just-zoom-in"
version = "0.1.0"
description = "Sequential cross-view geolocalization experiments for JustZoomIn."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "albumentations==2.0.8",
    "datashader==0.19.0",
    "matplotlib==3.10.9",
    "ml-collections==1.1.0",
    "numpy==2.4.4",
    "opencv-python==4.13.0.92",
    "pandas==3.0.3",
    "pillow==12.2.0",
    "pyarrow==24.0.0",
    "pyyaml==6.0.3",
    "tiledwebmaps==0.2.0",
    "torch==2.5.1+cu121",
    "torchvision==0.20.1+cu121",
    "tqdm==4.67.3",
    "transformers==5.8.1",
    "wandb==0.27.0",
]

[tool.uv]
exclude-dependencies = ["opencv-python-headless"]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu121" }
torchvision = { index = "pytorch-cu121" }
